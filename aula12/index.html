<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Koi no Yokan — Deftones</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>KOI NO YOKAN</h1>
  <p>Em japonês, o pressentimento de que você vai se apaixonar, mesmo antes de o amor começar. Um disco do Deftones sobre beleza, peso e entrega.</p>

  <!-- ===== VÍDEO ===== -->
  <h2>O pressentimento em imagens</h2>
  <video width="640" height="360" controls poster="imagem/poster.jpg" preload="metadata">
    <source src="video/cafe.mp4" type="video/mp4">
    <source src="video/cafe.webm" type="video/webm">
    <track src="video/legenda.vtt" kind="subtitles" srclang="pt" label="Português" default>
    Seu navegador não suporta vídeo.
    <a href="video/cafe.mp4">Baixe o vídeo (MP4)</a>.
  </video>

  <!-- ===== ÁUDIO ===== -->
  <h2>Aperte o play e sinta o clima</h2>
  <audio controls>
    <source src="audio/jingle.mp3" type="audio/mpeg">
    <source src="audio/jingle.ogg" type="audio/ogg">
    Seu navegador não suporta áudio.
    <a href="audio/jingle.mp3">Baixe o trecho (MP3)</a>.
  </audio>

  <!-- ===== YOUTUBE ===== -->
  <h2>Deftones no YouTube</h2>
<iframe width="560" height="315" src="https://www.youtube.com/embed/5FoUNvoFFVY?si=u1Th9rYdiIDVQsrK" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

  <!-- ===== PDF ===== -->
  <h2>O libreto do disco</h2>
  <object data="docs/cardapio.pdf" type="application/pdf" width="640" height="400">
    Seu navegador não mostra PDF aqui.
    <a href="docs/cardapio.pdf">Abra o libreto em PDF</a>.
  </object>

</body>
</html>
