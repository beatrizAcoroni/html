<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafeteria Grão Dourado — CSS Interno</title>
  <!--
    FORMA 2: CSS INTERNO
    O estilo fica reunido na tag <style>, dentro do <head>.
      -->
  <style>
   header {
     background-color: #6f4e37;
   }
   body {
     background-color: #f5f5dc;
     margin: 0;
   }
    main {
      padding: 20px;
      width: 400px;
      margin: 0 auto;
    }
    main h2 {
      text-align: center;
      color: #6f4e37;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
   header h1 {
     color: #fff;
     text-align: center;
     padding: 10px;
     font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
     text-align: center;
   }
    header p {
      color: #fff;
      text-align: center;
      font-family: 'Poppins', sans-serif;
    }
   section {
     background-color: #fff;
     border: 2px solid #d4a373;
     padding: 10px;
     margin-bottom: 10px;
     border-radius: 10px;
   }
   section h3 {
    margin-top: 0;
     color: #6f4e37;
     font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
   }
   footer {
     background-color: #6f4e37;
     color: #fff;
     text-align: center;
     padding: 10px;
   }
  </style>
</head>
<body>

  <header>
    <h1>☕ Cafeteria Grão Dourado</h1>
    <p>O melhor café de Suzano</p>
  </header>

  <main>
    <h2>Nosso cardápio</h2>

    <section>
      <h3>Espresso</h3>
      <p>Café curto e intenso. R$ 6,00</p>
    </section>

    <section>
      <h3>Cappuccino</h3>
      <p>Café, leite vaporizado e canela. R$ 9,50</p>
    </section>

    <section>
      <h3>Pão de queijo</h3>
      <p>Quentinho, saído do forno. R$ 5,00</p>
    </section>
  </main>

  <footer>
    Exemplo de aula — CSS Interno
  </footer>

</body>
</html>
